user  root;
worker_processes  8;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    use epoll;
    worker_connections  65535;
    multi_accept on;
}

http {
    resolver 127.0.0.11 valid=10s;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100m;


    # portainer主节点 ip
    geo $masterIp {
        default 218.192.145.16;
    }

    # 流媒体的ip
    geo $zlmIp {
        default 218.192.145.19;
    }

    server {
        listen  443 ssl http2;

        # 学校所给的域名
        server_name localhost;
        #证书文件路径
        ssl_certificate /data/nginx/portal_ly-sky_com.crt;
        #私钥文件路径
        ssl_certificate_key /data/nginx/portal_ly-sky_com.key;

        ssl_session_timeout 5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        #----------------------------------------- API 网关 -----------------------------------------
        # 默认访问到后端网关
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            set $gateway_server ly-ac-gateway-svc;
            proxy_pass http://$gateway_server:50000;
        }

        # 后端服务的api网关配置
        location /api {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            set $gateway_server ly-ac-gateway-svc;
            proxy_pass http://$gateway_server:50000;
        }

        # 后端服务的api网关配置
        location /gateway {
            proxy_set_header Host $http_host;
            proxy_set_header   X-Real-IP   $remote_addr;
            proxy_set_header alias  /gateway;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            set $gateway_server ly-ac-gateway-svc;
            proxy_pass http://$gateway_server:50000;
        }

        #----------------------------------------- 学校管理后台 前端 -----------------------------------------
        # 统一认证ui
        location /auth {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            set $auth_ui ly-ac-auth-ui;
            proxy_pass http://$auth_ui;
        }

        # 学院管理后台ui
        location /console {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            set $console_ui ly-ac-console-ui;
            proxy_pass http://$console_ui;
        }

        #----------------------------------------- 督导巡课 前端页面 -----------------------------------------
        # 督导巡课web端
        location /ispot {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            set $supervise_ui ly-ac-supervise-ui;
            proxy_pass http://$supervise_ui;
        }

        # 督导巡课H5平台
        location /mspot {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            set $supervise_mobile_ui ly-ac-supervise-mobile-ui;
            proxy_pass http://$supervise_mobile_ui;
        }

        #----------------------------------------- 奕课堂3.0前端页面 -----------------------------------------
        # 奕课堂3.0web前台
        location /iedu/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            set $client_ui ly-ac-client-ui;
            proxy_pass http://$client_ui;
        }

        # 奕课堂3.0课中
        location /live/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            set $live_ui ly-ac-live-ui;
            proxy_pass http://$live_ui;
        }

        # 奕课堂 3.0-H5
        location /mobile/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            set $ykt_mobile_ui ly-ac-ykt-mobile-ui;
            proxy_pass http://$ykt_mobile_ui;
        }

        #----------------------------------------- 奕管 前端页面 -----------------------------------------
        # 奕管 web
        location ^~/izone/ {
            proxy_set_header Host $http_host;
            proxy_set_header alias  /izone;
            proxy_set_header   X-Real-IP   $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            set $control_ui ly-ac-control-ui;
            proxy_pass http://$control_ui/;
        }

        # 奕管 h5
        location ^~/ibook/ {
            proxy_set_header Host $http_host;
            proxy_set_header alias  /ibook;
            proxy_set_header   X-Real-IP   $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            set $yg_mobile_ui ly-ac-yg-mobile-ui;
            proxy_pass http://$yg_mobile_ui/;
        }

        #----------------------------------------- emqx 前端页面 -----------------------------------------
        # emqx控制台
        location /emqx/ {
            proxy_set_header Host $http_host;
            proxy_set_header alias  /emqx;
            proxy_set_header   X-Real-IP   $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;

            set $emqx_service zhjx-emqx;
            proxy_pass http://$emqx_service:18083/;
        }

        # mqtt ws
        location /mqtt {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            set $emqx_service zhjx-emqx;
            proxy_pass http://$emqx_service:8083/mqtt;
        }

        #------------------------------------------ minio -----------------------------------------
        location /ly-zhjx {
            proxy_send_timeout 1200;
            proxy_read_timeout 1200;
            proxy_connect_timeout 1200;
            client_max_body_size 500m;
            proxy_set_header Authorization "";
            proxy_set_header Host $http_host;
            proxy_set_header alias  /minio;
            proxy_set_header   X-Real-IP   $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            set $minio_server zhjx-minio;
            proxy_pass http://$minio_server:9000;
        }

        location /ly-chunk {
            proxy_send_timeout 1200;
            proxy_read_timeout 1200;
            proxy_connect_timeout 1200;

            proxy_set_header Authorization "";
            proxy_set_header Host $http_host;
            proxy_set_header alias  /emqx;
            proxy_set_header   X-Real-IP   $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            set $minio_server zhjx-minio;
            proxy_pass http://$minio_server:9000;
        }

        location ~ .chunk$ {
            proxy_send_timeout 1200;
            proxy_read_timeout 1200;
            proxy_connect_timeout 1200;

            client_max_body_size 500m;
            proxy_set_header Authorization "";
            proxy_set_header Host $http_host;
            proxy_set_header alias  /emqx;
            proxy_set_header   X-Real-IP   $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            set $minio_server zhjx-minio;
            proxy_pass http://$minio_server:9000;
        }

        #----------------------------------------- kkfileview 预览 -----------------------------------------
        location /preview/ {
            proxy_send_timeout 1200;
            proxy_read_timeout 1200;
            proxy_connect_timeout 1200;
            proxy_set_header Host $http_host;
            proxy_set_header alias  /preview;
            proxy_set_header   X-Real-IP   $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            set $fileview_server zhjx-fileview;
            proxy_pass http://$fileview_server:8012;
        }

        #----------------------------------------- zlmediakit api ----------------------------------------------
        # zlmediakit api
        location /zlapi {
            rewrite ^/zlapi/(.*) /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_pass http://$zlmIp:80;
        }

        #----------------------------------------- nginx 状态检测 -----------------------------------------
        # nginx 状态检测
        location /status {
            stub_status on;
            access_log off;
        }

        location ~ /actuator {
                    return 403;
        }

        #----------------------------------------- nacos ----------------------------------------------
        # nacos web 页面
        location /nacos/ {

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            set $nacos_server zhjx-nacos;
            proxy_pass http://$nacos_server:8848;
        }

    }


