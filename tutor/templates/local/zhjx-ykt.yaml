version: '3.8'

x-ui-environment:
  &ui-environment
  spring.cloud.inetutils.preferred-networks: 10.10.0
  API_GATEWAY_URL: http://ly-ac-gateway-svc:50000
  SCHOOL_ID: ${SCHOOL_ID}
  API_TENANT_URL: http://${MASTER_NODE_IP}:50004
  API_OBJECT_STORAGE_URL: http://${MASTER_NODE_IP}:50007
  ISPOT_APP_SOURCE: U2FsdGVkX1+uTHJpKPc3BiX/9YDbAbwQ8j+2T7+/IvtTcbmT3oq6XQNkx4qIdnVwdX79Ol23CoEfjY7V7g7kj8If8I1P2j6MK+7cKEkwCrg57dKFH1tuhzPeTtP6YSbN

x-svc-environment:
  &svc-environment
  discovery: zhjx-nacos
  nacosGroup: DEFAULT_GROUP
  mysqlHost: ${MASTER_NODE_IP}
  mysqlPort: 3306
  mysqlUser: root
  mysqlPassword: LianYi@123
  serverAddr: http://zhjx-nacos:8848

services:
  # 平台
  ly-ac-client-ui:
    image: ${tcImage}/ly-ac-client-ui:${yktTag}
    init: true
    environment: *ui-environment
    networks:
      - portainer_agent_network

  # 课中
  ly-ac-live-ui:
    image: ${tcImage}/ly-ac-live-ui:${yktTag}
    init: true
    environment: *ui-environment
    networks:
      - zhjx-network


  #H5
  ly-ac-ykt-mobile-ui:
    image: ${tcImage}/ly-ac-ykt-mobile-ui:${yktTag}
    init: true
    environment: *ui-environment
    networks:
      - zhjx-network
      -
  #互动中心
  ly-ac-interaction-tool-svc:
    image: ${tcImage}/ly-ac-interaction-tool-svc:${apiTag}
    init: true
    environment: *svc-environment
    networks:
      - zhjx-network
    entrypoint: [ "" ]
    command: [ "sh", "-c", "java -Xms1G -Xmx2G -XX:MaxMetaspaceSize=256M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -XX:+UseStringDeduplication -jar /usr/local/app.jar" ]

  ly-ac-resource-svc:
    image: ${tcImage}/ly-ac-resource-svc:${apiTag}
    init: true
    environment: *svc-environment
    networks:
      - zhjx-network
    entrypoint: [ "" ]
    command: [ "sh", "-c", "java -Xms1G -Xmx2G -XX:MaxMetaspaceSize=256M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -XX:+UseStringDeduplication -jar /usr/local/app.jar" ]

networks:
  zhjx-network:
    external: true